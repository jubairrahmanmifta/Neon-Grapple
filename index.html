<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#05060f" />
    <meta name="description" content="Neon Grapple — a one-button grapple-swing endless runner through a neon cyberpunk city." />
    <title>Neon Grapple</title>
    <link rel="icon" href="data:," />
    <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #05060f;
      }

      body {
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      #game {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game" aria-label="Neon Grapple game canvas">
      Your browser does not support the Canvas 2D API required to play Neon Grapple.
    </canvas>
    <noscript>Neon Grapple requires JavaScript to run.</noscript>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
